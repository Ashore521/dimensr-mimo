[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensr-mimo"
version = "0.1.0"
description = "Dimension-aware shared-expression multi-input multi-output symbolic regression"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Repository = "https://github.com/Ashore521/dimensr-mimo"
Issues = "https://github.com/Ashore521/dimensr-mimo/issues"

[project.scripts]
dimensr-mimo = "dimensr_mimo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
