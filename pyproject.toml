[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensr-mimo"
version = "1.2.1"
description = "Joint multi-output dimension-constrained neural genetic symbolic regression"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "sympy>=1.12", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "psutil>=5.9"]

[project.scripts]
dimensr-mimo = "dimensr_mimo.cli:main"

[project.urls]
Repository = "https://github.com/Ashore521/dimensr-mimo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
